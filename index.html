<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Workshop Box, 108 cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F0EC; --ink:#1B1B19; --soft:#6E6C66; --rule:#C9C7C0;
  --stage:#2F2F2D; --card-w:300px; --card-h:calc(var(--card-w) * 1.43); --k:1.2605;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--stage);color:#EDEBE5;font-family:Archivo,system-ui,sans-serif;
     padding:26px 18px 70px;-webkit-font-smoothing:antialiased}

.head{max-width:1580px;margin:0 auto 18px;display:flex;align-items:baseline;
      justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
       letter-spacing:.26em;text-transform:uppercase}
.hint{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.18em;
      text-transform:uppercase;color:#8C8A84}

/* the nav is the tab stack. nine sections, nine colours, in book order. */
.tabs{max-width:1580px;margin:0 auto 8px;display:flex;gap:3px;flex-wrap:wrap}
.tab{flex:1 1 118px;background:none;cursor:pointer;text-align:left;
     border:none;border-top:9px solid var(--c);padding:9px 10px 10px;
     background:rgba(255,255,255,.045);transition:.15s}
.tab:hover{background:rgba(255,255,255,.11)}
.tab.on{background:var(--c)}
.tab .nm{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;
         font-weight:600;letter-spacing:.15em;text-transform:uppercase;
         color:#CFCDC6;line-height:1.35}
.tab.on .nm{color:#fff}
.tab .ct{display:block;font-family:"Archivo Narrow",sans-serif;font-weight:700;
         font-size:17px;color:#8C8A84;margin-top:3px;line-height:1}
.tab.on .ct{color:#fff}

.bar{max-width:1580px;margin:0 auto 24px;display:flex;align-items:baseline;
     justify-content:space-between;gap:14px;flex-wrap:wrap;
     border-bottom:1px solid #46463F;padding-bottom:12px}
.where{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
       text-transform:uppercase}
.acts{display:flex;gap:6px}
.btn{background:none;border:1px solid #4A4A46;color:#B8B6AE;cursor:pointer;
     font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;
     text-transform:uppercase;padding:7px 11px 6px;transition:.15s}
.btn:hover{border-color:#9A988F;color:#F1F0EC}

.grid{max-width:1580px;margin:0 auto;display:grid;gap:20px;
      grid-template-columns:repeat(5,var(--card-w));justify-content:center}
@media (max-width:1640px){.grid{grid-template-columns:repeat(4,var(--card-w))}}
@media (max-width:1310px){.grid{grid-template-columns:repeat(3,var(--card-w))}}
@media (max-width:990px){.grid{grid-template-columns:repeat(2,var(--card-w))}}
@media (max-width:670px){:root{--card-w:min(300px,calc(100vw - 36px))}
  .grid{grid-template-columns:repeat(1,var(--card-w))}
  .tab{flex:1 1 88px}}

.slot{width:var(--card-w);height:var(--card-h);perspective:1600px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .62s cubic-bezier(.2,.7,.2,1);
      transform-style:preserve-3d;box-shadow:0 4px 22px rgba(0,0,0,.42)}
.slot.flip .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
      overflow:hidden;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);background:var(--paper);color:var(--ink)}

.front{padding:0 calc(15px * var(--k)) calc(15px * var(--k))}
.reg{display:flex;gap:2px;height:8px;margin:0 calc(-15px * var(--k))}
.reg i{flex:1;display:block;height:3px;align-self:flex-start}
.reg i.self{height:8px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:13px;gap:8px}
.plate{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:calc(19px * var(--k));
       letter-spacing:-.01em;line-height:1}
.sect{font-family:"IBM Plex Mono",monospace;font-size:calc(8px * var(--k));font-weight:500;
      letter-spacing:.2em;text-transform:uppercase;opacity:.82}
.frule{height:1px;margin-top:9px;opacity:.4;background:#fff}
.line{font-family:"Archivo Narrow",sans-serif;font-weight:700;line-height:1.06;
      letter-spacing:-.014em;margin-top:13px;flex:1}
.tool{font-family:"IBM Plex Mono",monospace;font-size:calc(7.5px * var(--k));font-weight:600;
      letter-spacing:.18em;text-transform:uppercase;padding-top:9px;
      border-top:1px solid rgba(255,255,255,.42)}
.mark{font-family:"IBM Plex Mono",monospace;font-size:calc(6.5px * var(--k));letter-spacing:.2em;
      text-transform:uppercase;opacity:.55;margin-top:8px}

.back{padding:18px 19px 16px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bplate{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:19px;line-height:1}
.bname{font-family:"IBM Plex Mono",monospace;font-size:7px;font-weight:600;
       letter-spacing:.16em;text-transform:uppercase;text-align:right}
.brule{height:1.5px;margin:8px 0 12px}
.askh{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
      letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.ask li{list-style:none;font-size:calc(10.5px * var(--s,1));font-weight:500;line-height:1.34;
        margin-bottom:calc(6px * var(--s,1));padding-left:11px;position:relative}
.ask li:before{content:"";position:absolute;left:0;top:5px;width:4px;height:4px;background:var(--c)}
.body{margin-top:auto;padding-top:calc(11px * var(--s,1));border-top:1px solid var(--rule);
      font-size:calc(8.6px * var(--s,1));line-height:1.46;color:#403E39}
.body p{margin-bottom:calc(5px * var(--s,1))}
.foot{margin-top:calc(10px * var(--s,1));padding-top:calc(8px * var(--s,1));border-top:1px solid var(--rule)}
.foot .lbl{font-family:"IBM Plex Mono",monospace;font-size:6.5px;letter-spacing:.2em;
           text-transform:uppercase;color:var(--soft);display:block;margin-bottom:3px}
.foot .to{font-size:calc(10px * var(--s,1));font-weight:600}
</style>

<div class="head">
  <div class="title">The Workshop Box</div>
  <div class="hint">Click a card to turn it &nbsp;/&nbsp; F turns the section &nbsp;/&nbsp; arrows change tab</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="bar">
  <div class="where" id="where"></div>
  <div class="acts">
    <button class="btn" id="prev">Back</button>
    <button class="btn" id="flip">Turn all</button>
    <button class="btn" id="next">Next</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
const DATA = {"sections": [{"name": "Seeing Clearly", "color": "#0B5FCE"}, {"name": "Character", "color": "#6A32C9"}, {"name": "Relationships", "color": "#C81E78"}, {"name": "Influence", "color": "#1E8F4E"}, {"name": "Building", "color": "#E8A400"}, {"name": "Living Well", "color": "#00857D"}, {"name": "Innovation", "color": "#D62828"}, {"name": "Stewardship", "color": "#7BA428"}, {"name": "Legacy", "color": "#E8641A"}], "cards": [{"plate": "1.01", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Reality Always Wins", "lines": ["Reality has never lost", "an argument."], "askHead": "Before You Decide", "ask": ["What do I know?", "What do I only believe?", "What evidence supports my conclusion?", "What evidence challenges it?"], "body": ["People argue with reality every day. Reality never argues back. It simply waits.", "Gravity does not care what we believe. Nature does not care what we intended. Markets do not care what we hoped.", "When reality disagrees with us, reality is not the problem. Our understanding is.", "The sooner we align ourselves with reality, the sooner our decisions improve."], "link": "1.02 Clean Both Sides of the Glass", "sig": ""}, {"plate": "1.02", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Clean Both Sides of the Glass", "lines": ["To see clearly,", "you must clean both sides", "of the glass."], "askHead": "Before You Decide", "ask": ["What assumptions am I making?", "Which assumptions have I verified?", "What facts might I still be missing?", "What evidence would change my mind?"], "body": ["Every window has two sides. When the view becomes cloudy, most people instinctively clean the side facing everyone else.", "Thinking works the same way. We notice flaws in another person's reasoning before recognizing the assumptions and blind spots shaping our own.", "Sometimes the distortion belongs to them. Sometimes it belongs to us. Most often, it belongs to both.", "Clean your side first. The view usually changes."], "link": "1.03 If the Facts Disagree with the Theory", "sig": ""}, {"plate": "1.03", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "If the Facts Disagree with the Theory", "lines": ["If the facts disagree", "with the theory,", "the theory, not reality,", "is wrong."], "askHead": "Before You Decide", "ask": ["Am I testing my conclusion or defending it?", "What evidence would change my mind?", "What does reality actually say?"], "body": ["Ideas deserve respect. Reality deserves authority.", "A theory is something to test, not defend. When better evidence appears, change the theory.", "Changing your mind when the evidence changes is not weakness. It is intellectual honesty."], "link": "1.04 Collect the Dots Before Connecting Them", "sig": ""}, {"plate": "1.04", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Collect the Dots Before Connecting Them", "lines": ["Collect as many dots", "as you can", "before you start", "connecting them."], "askHead": "Before You Decide", "ask": ["What dots have I collected?", "Which dots am I assuming?", "What information is still missing?", "Am I connecting evidence or filling gaps?"], "body": ["The mind is remarkably good at finding patterns. It is also remarkably good at inventing them.", "If something does not make sense, there is a good chance you do not have all the facts yet.", "Curiosity gathers. Judgment waits. Resist filling empty spaces with convenient assumptions.", "Every conclusion is only as good as the dots you collected before you connected them."], "link": "1.05 Never Trust Intuition. Prove It.", "sig": ""}, {"plate": "1.05", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Never Trust Intuition. Prove It.", "lines": ["Never trust", "your intuition.", "Prove it."], "askHead": "Before You Decide", "ask": ["What evidence supports my intuition?", "What evidence contradicts it?", "Am I testing an idea or defending it?", "What experiment could prove me wrong?"], "body": ["Intuition is valuable. It often tells us where to begin. It should rarely decide where we end.", "A feeling can point toward a possibility. Evidence determines whether that possibility survives reality.", "Some of my best ideas began as intuition. Some of my worst mistakes did too. The difference was whether I tested them.", "Treat intuition as an invitation to investigate, not permission to conclude."], "link": "1.06 Bafflegab", "sig": ""}, {"plate": "1.06", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Bafflegab", "lines": ["Language should", "reduce uncertainty,", "not increase it."], "askHead": "Before You Decide", "ask": ["Am I explaining or impressing?", "Could I make this simpler without making it less true?", "Do my words reduce uncertainty?"], "body": ["Bafflegab creates the illusion of understanding while avoiding genuine explanation. It substitutes unnecessary complexity or fashionable terminology for clear reasoning.", "When someone truly understands a subject, they usually make it clearer, not more confusing.", "During one particularly complicated meeting, I finally said, “Your bafflegab will certainly lead to a kerfuffle.” Everyone laughed. The point landed.", "Sometimes humor explains what argument cannot."], "link": "1.07 Better Questions", "sig": ""}, {"plate": "1.07", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Better Questions", "lines": ["The quality", "of your answers", "depends on the quality", "of your questions."], "askHead": "Before You Decide", "ask": ["What problem am I really solving?", "What question am I avoiding?", "What would an outsider ask?", "Have I framed the question too narrowly?"], "body": ["Answers often end conversations. Good questions begin them.", "When progress stalls, improve the question before searching harder for an answer.", "A better question can expose a hidden assumption, reveal a missing fact, or turn an argument into an investigation.", "The objective is not endless questioning. It is asking enough of the right questions to deserve the answer."], "link": "1.08 Remain Teachable", "sig": ""}, {"plate": "1.08", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Remain Teachable", "lines": ["The moment you believe", "there is nothing", "left to learn,", "your education", "quietly stops."], "askHead": "Before You Decide", "ask": ["What can this teach me?", "What assumption have I stopped questioning?", "When did experience become certainty?", "Who knows something I do not?"], "body": ["Never stop learning is easy to say. Remaining teachable is harder, because it requires humility after experience has made you confident.", "Experience is valuable, but it becomes a trap when yesterday's success becomes today's certainty.", "Stay curious enough to search for truth and honest enough to admit when you are still searching."], "link": "1.09 Build the Scaffold First", "sig": ""}, {"plate": "1.09", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Build the Scaffold First", "lines": ["Don't climb a ladder", "to reach a conclusion.", "Build a scaffold", "you can stand on."], "askHead": "Before You Decide", "ask": ["Am I climbing toward the answer I wanted before I began?", "What supports this conclusion?", "Which level of my reasoning is weakest?", "Could someone else inspect this structure and stand on it with me?"], "body": ["Too many people decide where they want to land, climb straight there, then build support after they arrive. That is not reasoning. It is retrofitting.", "A scaffold is built level by level. Each level must be strong enough to support the next.", "Observation supports evidence. Evidence tests assumptions. Tested assumptions support reasoning. Reasoning supports the conclusion.", "A conclusion worth keeping should support the weight of evidence, scrutiny, and time. Build the scaffold first."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 1", "section": "Seeing Clearly", "color": "#0B5FCE", "slot": 1, "name": "Workshop Reflection", "lines": ["A conclusion", "should be earned."], "askHead": "Workshop Reflection", "ask": ["What did reality teach you?", "What will you build differently next time?"], "body": ["Seeing clearly is not about becoming certain faster. It is about becoming disciplined enough to deserve confidence when it finally arrives."], "link": "2.01 Accept Yourself Honestly", "sig": ""}, {"plate": "2.01", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Accept Yourself Honestly", "lines": ["Self-acceptance", "is not an excuse", "to stop growing.", "It is the place", "from which", "honest growth begins."], "askHead": "Before You Decide", "ask": ["Am I accepting myself honestly, or excusing what I should improve?", "What boundary, responsibility, or opportunity does reality require?"], "body": ["Acceptance is not approval. It is the starting point of honest observation.", "You cannot improve yourself while pretending to be someone else.", "Accepting yourself as you are does not mean lowering your standards. It means seeing yourself accurately before deciding what must change."], "link": "2.02 Integrity Without an Audience", "sig": ""}, {"plate": "2.02", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Integrity Without an Audience", "lines": ["Integrity demands", "doing the right thing", "even when", "no one is observing."], "askHead": "Before You Decide", "ask": ["What would I do if no one ever knew?", "Am I protecting my reputation or my integrity?", "What small private choice is shaping my character right now?"], "body": ["Integrity is not a speech. It is not a reputation. It is the quiet decision to remain aligned with what is right when nobody is there to reward you for it.", "A person can perform virtue in public and abandon it in private. That is not integrity. That is theater.", "The small choices matter because they become the pattern. Return the borrowed pen. Tell the truth when lying would be convenient. Fix the mistake before anyone notices. Keep the promise after the excitement fades.", "Over time, private decisions become public character.", "You do not suddenly become trustworthy during great pressure. Pressure reveals whether trustworthiness was already built."], "link": "2.03 Accountability Is Ownership", "sig": ""}, {"plate": "2.03", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Accountability Is Ownership", "lines": ["If you are not", "changing something,", "you are choosing", "something."], "askHead": "Before You Decide", "ask": ["What part of this situation belongs to me?", "Am I explaining, avoiding, or owning?", "What action would accountability require today?"], "body": ["Accountability begins when excuses end.", "That does not mean every problem is your fault. It means your response belongs to you.", "Blame is often easier than ownership because blame moves responsibility away from us. Ownership brings it back where action becomes possible.", "You are accountable for your decisions. You are also accountable for the opportunities you allow to slip away through delay, avoidance, pride, fear, or distraction.", "If something matters and you keep doing nothing, doing nothing has become your choice.", "That realization can be uncomfortable. It can also be liberating. The moment you own your part, you regain the ability to change it."], "link": "2.04 When You Know Better, Do Better", "sig": ""}, {"plate": "2.04", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "When You Know Better, Do Better", "lines": ["When you know better,", "do better.", "Do not let ego", "stand in the way."], "askHead": "Before You Decide", "ask": ["What do I know now that I did not know before?", "What behavior should change because of it?", "Am I resisting the better path because the old one was mine?"], "body": ["Learning is not complete when understanding arrives. It is complete when behavior changes.", "A person can collect information for years and remain exactly the same. That is not growth. It is storage.", "The hard part is not discovering a better way. The hard part is admitting that the better way now requires something from you.", "Once you know better, the old excuse expires.", "This is where humility matters. Better knowledge can feel like a gift, but it can also feel like an indictment of how you used to think. Let it be a gift.", "You were not wrong forever. You were simply incomplete until reality taught you more."], "link": "2.05 Discipline Determines Whether You Get There", "sig": ""}, {"plate": "2.05", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Discipline Determines Whether You Get There", "lines": ["Talent defines what", "you could become.", "Motivation gets", "you started.", "Discipline determines", "whether you get there."], "askHead": "Before You Decide", "ask": ["Where am I relying on motivation instead of discipline?", "What system would keep me moving when my mood changes?", "What small action must be repeated until it becomes reliable?"], "body": ["Talent is useful. Motivation is useful. Neither is dependable.", "Talent can make the beginning easier, but it often disappears when the work becomes repetitive, difficult, or boring. Motivation can light the match, but it rarely keeps the fire going through weather.", "Discipline is what remains when the excitement leaves: the habit of doing the necessary thing because the goal still matters, not because the mood is favorable.", "The world rarely rewards intensity for a week. It rewards disciplined thinking and disciplined action over time."], "link": "2.06 Choose Your Response", "sig": ""}, {"plate": "2.06", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Choose Your Response", "lines": ["Anger may arrive", "uninvited.", "What you do next", "matters."], "askHead": "Before You Decide", "ask": ["Am I responding or reacting?", "What would calm allow me to see that anger is hiding?", "Will I respect this response tomorrow?"], "body": ["Anger often feels automatic. It can arrive before we have time to invite it in. But what happens next is still ours.", "Shouting may create motion. It rarely creates progress.", "Calm does not mean passive. Calm does not mean weak. Calm means you have not handed control of your decisions to the loudest emotion in the room.", "Some moments require firmness. Some require immediate action. Some require leaving the room before your mouth creates another problem.", "The strongest response is usually the one you can still respect tomorrow."], "link": "2.07 Pressure Is a Privilege", "sig": ""}, {"plate": "2.07", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Pressure Is a Privilege", "lines": ["Pressure is a privilege.", "It means you are trusted", "with something", "important."], "askHead": "Before You Decide", "ask": ["What responsibility has been trusted to me?", "Am I focused on the burden or the opportunity?", "What would steady leadership look like here?"], "body": ["Pressure is uncomfortable because it means the outcome matters. That is not always bad news.", "Pressure often appears when responsibility has found you. Someone trusted you with the problem, the decision, the team, or the mission.", "Do not focus only on the weight. Notice the trust.", "Pressure can crush people who see only burden. It can strengthen people who understand that responsibility is evidence of importance.", "The goal is not to avoid pressure. The goal is to become the kind of person who can carry it without becoming careless, cruel, or afraid.", "Treat the pressure of your responsibilities as a privilege."], "link": "2.08 Recklessness Is Not Courage", "sig": ""}, {"plate": "2.08", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Recklessness Is Not Courage", "lines": ["No matter how smart,", "a reckless person", "does not learn."], "askHead": "Before You Decide", "ask": ["Am I being courageous or careless?", "What risk am I pretending not to see?", "Who pays the price if I am wrong?"], "body": ["Courage and recklessness can look similar from a distance. They are not the same.", "Courage sees the risk and moves with judgment. Recklessness ignores the risk and calls itself bravery.", "A simple person can learn. A reckless person often cannot, because recklessness treats consequences as someone else's problem.", "Children, and adults who behave like children, should not play with matches.", "Some situations demand boldness. But boldness without judgment is not leadership. It is a hazard.", "Before taking the leap, know whether you are acting from conviction, ego, impatience, or noise."], "link": "2.09 Strength and Kindness Belong Together", "sig": ""}, {"plate": "2.09", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Strength and Kindness Belong Together", "lines": ["Always be genuine", "in kindness or criticism,", "but never gratuitous", "with either."], "askHead": "Before You Decide", "ask": ["Am I being honest or simply harsh?", "Am I being kind or avoiding the truth?", "Can I say this firmly without making it cruel?"], "body": ["Kindness without strength can become weakness.", "Strength without kindness can become cruelty.", "Character requires both.", "Criticism should serve improvement, not ego. Kindness should be genuine, not performative. Neither should be used as decoration.", "Some people confuse harshness with honesty. Others confuse avoidance with compassion. Both are mistakes.", "The goal is not to make every conversation comfortable.", "The goal is to make it useful, truthful, and humane."], "link": "2.10 Respect Is Earned", "sig": ""}, {"plate": "2.10", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Respect Is Earned", "lines": ["Power is recognized.", "Respect is earned.", "You cannot demand either."], "askHead": "Before You Decide", "ask": ["Am I relying on position or earning trust?", "How do I treat people who cannot help me?", "Would my conduct justify the respect I expect?"], "body": ["Power can be assigned. Respect cannot.", "A title may give someone authority, but it does not automatically create trust. A person may be obeyed because of position and still not be respected because of character.", "Respect grows through consistency, fairness, competence, courage, restraint, and how people are treated when they have less power than you do.", "To judge someone else's competency or character, you must first display your own.", "Demanding respect usually reveals that it has not yet been earned.", "Live in a way that makes respect a natural conclusion, not a requested favor."], "link": "2.11 Master Yourself First", "sig": ""}, {"plate": "2.11", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Master Yourself First", "lines": ["Control begins", "with mastering yourself:", "your emotions, actions,", "and habits."], "askHead": "Before You Decide", "ask": ["What can I actually control here?", "What habit is quietly shaping my future?", "What would self-mastery require today?"], "body": ["Before you can lead a team, repair a system, build a company, or guide a family, you must first learn to govern yourself.", "That does not mean perfection. It means responsibility. The most useful control is close: your emotions, actions, habits, attention, and response.", "Your emotions are real, but they do not deserve to be in charge of every decision. Your habits are powerful, but they are not destiny. Your impulses may be loud, but volume is not authority.", "Self-control is not a cage. It is the foundation of freedom.", "The more you can govern yourself, the less you are governed by distraction, anger, fear, appetite, mood, and other people's opinions."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 2", "section": "Character", "color": "#6A32C9", "slot": 2, "name": "Workshop Reflection", "lines": ["Character is what carries", "clear thinking", "into action."], "askHead": "Workshop Reflection", "ask": ["What did this section ask of you?", "Where are you strong?", "Where are you pretending?", "What responsibility have you been avoiding?", "What habit, if changed, would make everything else easier?"], "body": ["Before moving on, pause long enough to be honest with yourself.", "Do not write what sounds good.", "Write what is true."], "link": "3.01 Let Lions Be Lions", "sig": ""}, {"plate": "3.01", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Let Lions Be Lions", "lines": ["Lions do not make", "good bears."], "askHead": "Before You Decide", "ask": ["Am I seeing this person as they are, or as I want them to be?", "Can I accept without surrendering my boundaries?"], "body": ["People are not raw material for us to remake into whatever would be most convenient.", "You cannot understand a person you are busy rewriting in your head.", "Acceptance does not require agreement. It means seeing a person as they actually are before deciding what place, if any, they should have in your life.", "Let lions be lions, tigers be tigers, and bears be bears."], "link": "3.02 Choose Your People Wisely", "sig": ""}, {"plate": "3.02", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Choose Your People Wisely", "lines": ["The people you choose", "to be around", "can change", "your entire life."], "askHead": "Before You Decide", "ask": ["Who makes me think better?", "Who leaves me stronger rather than drained?", "Am I offering the same value I expect from others?"], "body": ["Proximity is powerful. The people around you influence what becomes normal, what you tolerate, what you attempt, and sometimes what you believe is possible.", "Engage with valuable people, not merely available people. Availability is convenient. Value is reciprocal."], "link": "3.03 Givers Should Water Each Other", "sig": ""}, {"plate": "3.03", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Givers Should Water Each Other", "lines": ["When givers connect,", "something rare happens."], "askHead": "Before You Decide", "ask": ["Is generosity flowing in both directions?", "Does this relationship replenish or deplete?"], "body": ["Healthy generosity is reciprocal without being transactional.", "When two givers connect, neither has to keep score. You water each other. No one is drained. You share the light and both grow.", "Generosity should create growth, not dependency."], "link": "3.04 Boundaries Need No Apology", "sig": ""}, {"plate": "3.04", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Boundaries Need No Apology", "lines": ["No", "is a complete decision."], "askHead": "Before You Decide", "ask": ["What am I protecting?", "Have I stated the boundary clearly?", "Am I explaining because clarity is needed, or because I am seeking permission?", "Can I be generous without surrendering self-respect?"], "body": ["Boundaries are not hostility. They are clarity.", "You do not need to write a legal brief every time you say no. Over-explaining often turns a boundary into a negotiation.", "Support is not permission for exploitation."], "link": "3.05 Believe What People Show You", "sig": ""}, {"plate": "3.05", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Believe What People Show You", "lines": ["When someone", "shows you who they are,", "believe them."], "askHead": "Before You Decide", "ask": ["What pattern am I observing?", "Am I trusting evidence or potential?", "Has behavior changed, or only the explanation for it?"], "body": ["Character is usually revealed in patterns, not speeches.", "Pay attention to small things. Someone who returns a borrowed pen without being asked is showing you something. So is someone who casually takes what is not theirs.", "Trust should grow from observed behavior over time."], "link": "3.06 Dignity in Disagreement", "sig": ""}, {"plate": "3.06", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Dignity in Disagreement", "lines": ["Disagreement", "does not require", "contempt."], "askHead": "Before You Decide", "ask": ["Am I attacking the idea or the person?", "Would I make the same argument without contempt?", "What matters more: winning the exchange or improving the decision?"], "body": ["Strong people should be able to challenge an idea without diminishing the person who offered it.", "Healthy debate needs friction. It does not need humiliation. Contempt usually makes truth harder to find because people begin defending themselves instead of examining the problem.", "Challenge the argument vigorously. Preserve the dignity of the person making it."], "link": "3.07 Loyalty Requires Integrity", "sig": ""}, {"plate": "3.07", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Loyalty Requires Integrity", "lines": ["Loyalty is strongest", "when it can survive", "the truth."], "askHead": "Before You Decide", "ask": ["Am I protecting the person or protecting bad behavior?", "Can this relationship tolerate an honest conversation?", "Would silence be easier but less loyal?"], "body": ["Loyalty does not mean defending everything someone does.", "Sometimes the most loyal thing you can do is tell someone something they do not want to hear, privately, respectfully, and early enough for it to matter.", "Close ranks when necessary, but never close your eyes."], "link": "3.08 Conflict Should Resolve Something", "sig": ""}, {"plate": "3.08", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Conflict Should Resolve Something", "lines": ["I've never seen anyone", "shout anything done."], "askHead": "Before You Decide", "ask": ["What outcome am I trying to create?", "Will what I am about to say improve the situation?", "Am I responding with purpose or merely reacting?"], "body": ["Conflict is sometimes necessary. Chaos rarely is.", "Volume is not strength. Anger can make a point louder while making the solution harder to hear.", "The purpose of conflict should be clarity, protection, correction, or resolution. Otherwise it is usually just noise."], "link": "3.09 The Shards of Vengeance", "sig": ""}, {"plate": "3.09", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "The Shards of Vengeance", "lines": ["The shards of vengeance", "are sharp on all sides."], "askHead": "Before You Decide", "ask": ["Do I want resolution, justice, or revenge?", "What will this action cost me?", "Will I be freer when this is over?"], "body": ["Revenge feels directional. Damage rarely is.", "Justice, boundaries, and consequences can be necessary. Vengeance is different. It asks pain to heal pain.", "Be careful what you break while trying to make someone else bleed."], "link": "3.10 Alone Is Not Lonely", "sig": ""}, {"plate": "3.10", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Alone Is Not Lonely", "lines": ["Being alone", "is not the same", "as being lonely."], "askHead": "Before You Decide", "ask": ["Can I be alone without feeling abandoned?", "Can I belong without surrendering myself?"], "body": ["There is comfort in becoming at home with your own thoughts.", "Solitude can restore perspective, creativity, and independence. It teaches you whether you enjoy your own company without requiring you to reject the company of others.", "You may choose to stand alone, but never become alone."], "link": "3.11 Home Should Restore You", "sig": ""}, {"plate": "3.11", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Home Should Restore You", "lines": ["Home is a place", "to de-stress,", "not be stressed."], "askHead": "Before You Decide", "ask": ["Does my home restore me?", "Do the people I love feel safe being themselves there?", "What could I change to make home more peaceful?"], "body": ["The world will provide enough friction on its own.", "Home should offer some measure of safety, restoration, belonging, and peace. That does not mean a home without disagreement. It means a place where disagreement does not destroy security.", "Our favorite places are often where our favorite people are."], "link": "3.12 Let Them Find Their Own Path", "sig": ""}, {"plate": "3.12", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Let Them Find Their Own Path", "lines": ["Love people enough", "to let their life", "belong to them."], "askHead": "Before You Decide", "ask": ["Am I guiding or controlling?", "Have I made room for a path I would not choose?", "Can I be proud without needing credit?"], "body": ["Parenting, mentoring, and leadership all contain the same temptation: confusing guidance with ownership.", "Give people what you can. Teach them. Protect them when protection is appropriate. Share your mistakes. Open doors. Then let them walk.", "Success is not creating smaller versions of ourselves. It is helping people develop enough confidence, judgment, and courage to choose their own path."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 3", "section": "Relationships", "color": "#C81E78", "slot": 3, "name": "Workshop Reflection", "lines": ["The quality of a life", "is inseparable", "from the quality", "of its relationships."], "askHead": "Workshop Reflection", "ask": ["Who waters you, and whom do you water?", "Where do you need a boundary, an apology, an honest conversation, or simply more time?"], "body": ["Think about the people who have shaped you, the people you have shaped, and the relationships that make you feel most like yourself."], "link": "4.01 Nobody Wins Unless Everybody Wins", "sig": ""}, {"plate": "4.01", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Nobody Wins Unless Everybody Wins", "lines": ["There is not just", "one winner", "on a real team."], "askHead": "Before You Influence", "ask": ["Who is being left behind by this version of success?", "Does this outcome strengthen the system or merely reward one part of it?"], "body": ["A team victory that leaves people diminished is not really a victory. It is a transaction with damage hidden inside it.", "The strongest outcomes create shared momentum, shared ownership, and shared pride.", "No one wins unless everyone wins does not mean everyone gets everything they want. It means the mission is designed so that success strengthens the whole system."], "link": "4.02 Force Multipliers", "sig": ""}, {"plate": "4.02", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Force Multipliers", "lines": ["Those who make", "things happen", "are a force.", "Those who lead them", "are force multipliers."], "askHead": "Before You Influence", "ask": ["Who becomes more capable because I am here?", "Am I solving everything myself or multiplying capability?"], "body": ["A force can accomplish a great deal. A force multiplier creates alignment, direction, resources, confidence, and momentum so many capable people can accomplish what no single person could accomplish alone.", "The goal is not to remain the strongest person in the room. It is to increase the strength of the room.", "If you are a force, invest the time to become a force multiplier. Then teach others to do the same."], "link": "4.03 Great Ideas Are Not Always Your Own", "sig": ""}, {"plate": "4.03", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Great Ideas Are Not Always Your Own", "lines": ["Successful people", "understand", "that great ideas", "are not always their own."], "askHead": "Before You Influence", "ask": ["Am I listening for the idea, or for the title of the person offering it?", "Who is close enough to the work to see what I missed?"], "body": ["Listen for the idea, not merely the title of the person offering it.", "Some of the best improvements come from someone close enough to the work to see what leadership missed."], "link": "4.04 Purpose Before Ego", "sig": ""}, {"plate": "4.04", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Purpose Before Ego", "lines": ["Lead by four", "cornerstones:", "people before ego,", "purpose before noise,", "proof before opinion,", "pace before perfection."], "askHead": "Before You Influence", "ask": ["Which cornerstone is weakest here?", "Am I protecting purpose or protecting ego?"], "body": ["Ego distorts influence. Noise dilutes purpose. Opinion without proof weakens trust. Perfection can slow work that needs progress.", "These four cornerstones are not decorative. They are guardrails for influence under pressure."], "link": "4.05 Firm Words, Gentle Delivery", "sig": ""}, {"plate": "4.05", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Firm Words, Gentle Delivery", "lines": ["Be firm in what you say", "and gentle", "in how you say it."], "askHead": "Before You Influence", "ask": ["Is my message clear?", "Can I say it more gently without weakening it?", "Am I trying to solve or merely strike?"], "body": ["Clarity does not require cruelty. Gentleness does not require weakness.", "The best communication often combines a steady position with enough respect that the other person can still hear it.", "Tone can either carry truth or bury it under resistance."], "link": "4.06 One Warning Is Powerful", "sig": ""}, {"plate": "4.06", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "One Warning Is Powerful", "lines": ["One warning is powerful.", "Multiple warnings", "become empty threats."], "askHead": "Before You Influence", "ask": ["Have I already made the boundary clear?", "What action follows if nothing changes?"], "body": ["A clear warning draws a boundary and gives the other person a chance to respond.", "Repeated warnings without action teach people that your boundary is negotiable.", "Say what matters once. Then act deliberately if the line is crossed."], "link": "4.07 Let the Room Come to You", "sig": ""}, {"plate": "4.07", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Let the Room Come to You", "lines": ["Let the room come to you", "before speaking."], "askHead": "Before You Influence", "ask": ["What is the room telling me?", "Who has not spoken?", "Would waiting improve the quality of my contribution?"], "body": ["Influence is not always improved by being first.", "A room gives information before it gives permission. Watch posture, incentives, tension, confusion, and who is not speaking.", "Sometimes the strongest contribution comes after the room has revealed what it actually needs."], "link": "4.08 Willful Ignorance Is Dangerous", "sig": ""}, {"plate": "4.08", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Willful Ignorance Is Dangerous", "lines": ["Willful ignorance", "becomes dangerous", "when the person refusing", "to listen", "is empowered to decide."], "askHead": "Before You Influence", "ask": ["What information is being avoided?", "Who is empowered to decide without understanding?", "How can facts be made harder to ignore?"], "body": ["Not knowing is human. Refusing to know is different.", "Decision makers who cover their ears while allocating resources, setting policy, or directing people can turn ignorance into harm.", "Influence sometimes requires insisting that facts enter the room."], "link": "4.09 The Hard Stuff Is Why You Are Here", "sig": ""}, {"plate": "4.09", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "The Hard Stuff Is Why You Are Here", "lines": ["If what we do", "here was easy,", "someone else", "would be sitting", "in your chair."], "askHead": "Before You Influence", "ask": ["What is the problem, stated clearly?", "What expertise is missing?", "What obstacle can I remove?", "What decision would allow the team to move?"], "body": ["Do not waste the moment wishing the work were easier.", "Clarify the problem. Obtain the right expertise. Remove obstacles. Make the decision that allows the team to move.", "Focus on the opportunity to prove the team capable of doing difficult things well.", "The hard stuff is often where trust is built."], "link": "4.10 No Miracle People", "sig": ""}, {"plate": "4.10", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "No Miracle People", "lines": ["There are no", "miracle people.", "There are ordinary people", "who care enough", "to think deeply and act", "with disciplined", "intelligence."], "askHead": "Before You Influence", "ask": ["What ordinary discipline created this result?", "Can I teach the behavior rather than admire the outcome?"], "body": ["Calling someone a miracle can hide the ordinary disciplines that made the result possible.", "People create extraordinary outcomes by caring enough to understand clearly, act intelligently, and keep working when the result is not immediate.", "That is better news than miracle. It means the behavior can be learned."], "link": "4.11 Build Trust", "sig": ""}, {"plate": "4.11", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Build Trust", "lines": ["Trust is earned", "in small moments", "before it is needed", "in large ones."], "askHead": "Before You Influence", "ask": ["Where are words and actions mismatched?", "What small act would build trust now?"], "body": ["Trust is not built by declarations. It is built when words match actions, when credit is shared, when mistakes are owned, and when difficult truths are handled with care.", "Influence without trust becomes manipulation. Influence with trust becomes alignment."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 4", "section": "Influence", "color": "#1E8F4E", "slot": 4, "name": "Workshop Reflection", "lines": ["Influence is strongest", "when people leave", "more capable", "than they arrived."], "askHead": "Workshop Reflection", "ask": ["Who becomes stronger because you are in the room?", "Where does your influence need more dignity, proof, or patience?"], "body": ["Think about the people, rooms, teams, and conversations you influence. Where are you creating clarity, and where are you creating noise?"], "link": "5.01 You Can Fix a Bad Plan", "sig": ""}, {"plate": "5.01", "section": "Building", "color": "#E8A400", "slot": 5, "name": "You Can Fix a Bad Plan", "lines": ["You can fix", "a bad plan,", "but you can't", "fix no plan."], "askHead": "Before You Build", "ask": ["Do we have a plan?", "What makes it functional enough to begin?", "What will tell us when it needs to change?"], "body": ["Planning does not eliminate uncertainty. It gives you something concrete to test against it.", "A weak plan can be measured, challenged, corrected, and improved. No plan leaves everyone reacting."], "link": "5.02 Plans Don't Work Unless People Do", "sig": ""}, {"plate": "5.02", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Plans Don't Work Unless People Do", "lines": ["A beautiful plan", "without disciplined", "execution", "is decoration."], "askHead": "Before You Build", "ask": ["Who owns the next action?", "Does everyone understand the objective?", "Are we relying on motivation where discipline is required?"], "body": ["Systems, schedules, and resources matter. People still have to show up, communicate, decide, and do the work."], "link": "5.03 Functional Before Perfect", "sig": ""}, {"plate": "5.03", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Functional Before Perfect", "lines": ["Get it working safely.", "Then make it great."], "askHead": "Before You Build", "ask": ["What must work first?", "What must be safe?", "What did reality teach us?", "What changes next?"], "body": ["Perfection pursued too early can become sophisticated procrastination.", "Functional is the first stable platform, not the finish line. Don't wait for perfect. Launch, learn, improve.", "Real systems teach faster than imagined ones. Once something functions safely, reality supplies information planning alone cannot. Use that information. Improve the system. Repeat."], "link": "5.04 Measure What Matters", "sig": ""}, {"plate": "5.04", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Measure What Matters", "lines": ["Measure what matters.", "Act on what you learn."], "askHead": "Before You Build", "ask": ["What outcome matters?", "Are we measuring activity or performance?", "What trend requires action?"], "body": ["Measurement creates visibility. Visibility creates accountability. Accountability creates the opportunity to improve.", "But measurement is useful only when you measure what matters. Precise measurement of the wrong thing can make a bad system look sophisticated."], "link": "5.05 Build Small", "sig": ""}, {"plate": "5.05", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Build Small", "lines": ["The biggest jobs", "are complicated", "arrangements", "of simple tasks."], "askHead": "Before You Build", "ask": ["What is the next simple task?", "What depends on it?", "What can be completed today?"], "body": ["Large projects become intimidating when we stare at the whole thing.", "Break the work into pieces small enough to understand, assign, measure, and finish. Then arrange those pieces intelligently."], "link": "5.06 Organization Is Efficiency", "sig": ""}, {"plate": "5.06", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Organization Is Efficiency", "lines": ["Organization", "is the foundation", "of efficiency."], "askHead": "Before You Build", "ask": ["Where is friction wasting time?", "What should have a permanent home?", "What information should be easier to retrieve?"], "body": ["Don't just put it down. Put it away.", "Order reduces friction. Reduced friction preserves attention for work that actually requires thought."], "link": "5.07 Structure Creates Freedom", "sig": ""}, {"plate": "5.07", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Structure Creates Freedom", "lines": ["Structure does not", "limit freedom.", "Good structure makes", "useful freedom possible."], "askHead": "Before You Build", "ask": ["Where would structure create more freedom?", "What confusion keeps repeating?", "What system would reduce it?"], "body": ["A scaffold, a calendar, a checklist, a workstream, a disciplined routine, and a reliable infrastructure system all do the same thing: they create stable conditions for better action.", "Bad structure traps people. Good structure reduces avoidable confusion so energy can move toward the work."], "link": "5.08 Build Systems That Survive Your Moods", "sig": ""}, {"plate": "5.08", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Build Systems That Survive Your Moods", "lines": ["Build disciplined systems", "that survive your moods."], "askHead": "Before You Build", "ask": ["What depends on motivation?", "What routine would make progress more reliable?", "Where does distraction break the system?"], "body": ["Motivation fluctuates. Systems should not.", "If important work depends on feeling inspired, the work has been made unnecessarily fragile. Good systems carry you on ordinary, distracted, and difficult days."], "link": "5.09 Stop Hoping. Start Engineering.", "sig": ""}, {"plate": "5.09", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Stop Hoping. Start Engineering.", "lines": ["Stop hoping", "for the outcome", "and start engineering it."], "askHead": "Before You Build", "ask": ["What outcome am I merely hoping for?", "Which variables can I influence?", "What system makes success more likely?"], "body": ["Hope can point toward a destination. It cannot build the road.", "Define the outcome. Identify the variables. Build the system. Measure what happens. Adjust."], "link": "7.10 Build What Does Not Yet Exist", "sig": ""}, {"plate": "5.10", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Priority Governs Time", "lines": ["If work does not help", "clear the next", "meaningful milestone,", "it should not consume", "prime time."], "askHead": "Before You Build", "ask": ["What is the active priority?", "What milestone does today's work clear?", "What should remain visible without consuming prime time?"], "body": ["Not all important work deserves attention at the same moment.", "Active work needs protected focus. Work that is ready next should remain prepared to rise. Deferred work should remain visible without stealing prime time."], "link": "5.11 Milestones Make Progress Visible", "sig": ""}, {"plate": "5.11", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Milestones Make Progress Visible", "lines": ["Priority governs time.", "Time governs progress.", "Progress clears", "milestones."], "askHead": "Before You Build", "ask": ["What state must change next?", "Which tasks actually clear that milestone?", "Can everyone see what is active, next, and deferred?"], "body": ["Large goals become manageable when progress is converted into visible milestones.", "A milestone is not a pile of activity. It is a meaningful change in state: something completed, proven, approved, built, delivered, or made ready for the next stage."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 5", "section": "Building", "color": "#E8A400", "slot": 5, "name": "Workshop Reflection", "lines": ["What did you", "actually build?"], "askHead": "Workshop Reflection", "ask": ["What will you build next?"], "body": ["Good intentions are invisible until execution gives them form. Look back at the systems, plans, habits, and decisions you have built. Which ones survive reality? Which ones need another iteration?"], "link": "6.01 Add Life to Your Days", "sig": ""}, {"plate": "6.01", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Add Life to Your Days", "lines": ["You cannot know", "how many days you have.", "You can add life", "to the days you live."], "askHead": "Before You Decide", "ask": ["Where is my time going without my permission?", "Where am I watching life when I could be taking part in it?"], "body": ["Use your time deliberately. It is the one resource you spend continuously and can never replenish."], "link": "6.02 One More Day Is One Less Day", "sig": ""}, {"plate": "6.02", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "One More Day Is One Less Day", "lines": ["When we realize", "that one more day", "is really one less day,", "we start giving", "more value to the things", "that truly matter."], "askHead": "Before You Decide", "ask": ["If time were visibly decreasing, what would I value differently?", "What am I postponing that actually matters?"], "body": ["That is not pessimism. It is arithmetic.", "Time is finite whether we acknowledge it or not.", "Mortality can frighten us, or it can clarify us. Let it clarify you."], "link": "6.03 The Most Valuable Gift", "sig": ""}, {"plate": "6.03", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "The Most Valuable Gift", "lines": ["The most valuable gift", "you can give someone", "is your time."], "askHead": "Before You Decide", "ask": ["Who receives my best attention?", "Am I present when I am physically there?", "Who deserves more of my time?"], "body": ["Money can be replaced. Objects can be replaced. Time cannot.", "When you give someone your undivided attention, you are giving them a portion of your finite life."], "link": "6.04 Happiness Is in the Small Things", "sig": ""}, {"plate": "6.04", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Happiness Is in the Small Things", "lines": ["Happiness is in", "all the small things", "you overlook every day."], "askHead": "Before You Decide", "ask": ["What ordinary thing made today better?", "What have I stopped noticing because it is always there?"], "body": ["Much of happiness lives between milestones: a good conversation, sunlight through a window, useful work, laughter, or knowing someone you love is safe.", "Pay attention before familiarity makes something valuable invisible."], "link": "6.05 Define Your Own Fun", "sig": ""}, {"plate": "6.05", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Define Your Own Fun", "lines": ["Fun is yours", "to define."], "askHead": "Before You Decide", "ask": ["What do I actually enjoy?", "What restores rather than merely distracts me?"], "body": ["Do not subscribe automatically to someone else's definition of enjoyment.", "Know what restores you. Then stop apologizing for it."], "link": "6.06 Purpose Has Pleasures", "sig": ""}, {"plate": "6.06", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Purpose Has Pleasures", "lines": ["To feel fulfilled,", "seek, find, and feel", "the pleasures", "of your purpose."], "askHead": "Before You Decide", "ask": ["What work gives me energy even when difficult?", "Where do I feel useful?"], "body": ["Purpose should not be confused with constant sacrifice.", "Meaningful work can be difficult and still contain pleasure."], "link": "6.07 Comfort Can Cost You", "sig": ""}, {"plate": "6.07", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Comfort Can Cost You", "lines": ["Searching", "for endless comfort", "will destroy many dreams", "capable of providing it."], "askHead": "Before You Decide", "ask": ["What discomfort am I avoiding?", "What future comfort might that avoidance cost me?"], "body": ["Comfort is not the enemy. Dependence on comfort is.", "Growth usually asks us to tolerate uncertainty, inconvenience, embarrassment, fatigue, or temporary instability."], "link": "6.08 Dreams Require Sacrifice", "sig": ""}, {"plate": "6.08", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Dreams Require Sacrifice", "lines": ["Dreams require sacrifice,", "or the dream becomes", "the sacrifice."], "askHead": "Before You Decide", "ask": ["What does this goal actually require?", "Am I sacrificing the dream through avoidance?"], "body": ["Every serious ambition competes for finite resources: time, attention, money, comfort, and energy.", "Sacrifice should be deliberate, not theatrical. The objective is not suffering. It is alignment."], "link": "2.05 Discipline Determines Whether You Get There", "sig": ""}, {"plate": "6.09", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Mental Health Is Real", "lines": ["A mind can carry strain", "just as a body", "can carry injury."], "askHead": "Before You Decide", "ask": ["What is my mind repeatedly trying to tell me?", "What support would I recommend to someone I love in the same condition?", "Am I treating an invisible problem as if it is not real?"], "body": ["Treat recurring toxic thoughts, insecurity, unresolved pain, anxiety, exhaustion, or despair as real signals deserving attention, not character flaws to be hidden.", "Seeking help is not weakness. Ignoring a real condition because it is invisible is poor systems management."], "link": "6.10 Stress Is Expensive", "sig": ""}, {"plate": "6.10", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Stress Is Expensive", "lines": ["Do not let what", "you cannot control", "continuously live", "rent-free in your body."], "askHead": "Before You Decide", "ask": ["Can I act on this?", "If yes, what is the next action?", "If no, why am I continuing to rehearse it?"], "body": ["Stress has a purpose. Chronic stress is different.", "Solve what can be solved. Prepare for what can be prepared for. Then practice releasing what remains outside your control."], "link": "6.11 Live Exuberantly Without Ruining Your Future", "sig": ""}, {"plate": "6.11", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Live Exuberantly Without Ruining Your Future", "lines": ["The secret to youth", "is to live as exuberantly", "as you feel", "without ruining", "your future."], "askHead": "Before You Decide", "ask": ["Does this make today better at tomorrow's expense?", "What keeps me feeling alive?"], "body": ["Growing older does not require becoming dull.", "Enjoy today in ways your future self will be grateful you chose."], "link": "6.12 Get Lost in the Right Direction", "sig": ""}, {"plate": "6.12", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Get Lost in the Right Direction", "lines": ["Occasionally,", "take a moment", "to get lost", "in the right direction."], "askHead": "Before You Decide", "ask": ["Where have I become over-scheduled?", "What curiosity deserves room to wander?"], "body": ["Not every useful experience needs an itinerary.", "Direction matters more than perfect navigation."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 6", "section": "Living Well", "color": "#00857D", "slot": 6, "name": "Workshop Reflection", "lines": ["One more day", "is really", "one less day."], "askHead": "Workshop Reflection", "ask": ["What are you postponing that deserves to be lived?"], "body": ["Living well is not a future reward for finishing everything else. It is the way you use the time, attention, health, relationships, and purpose available to you now."], "link": "7.01 Question the Status Quo", "sig": ""}, {"plate": "7.01", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Question the Status Quo", "lines": ["We have always", "done it this way", "is not an explanation."], "askHead": "Before You Build", "ask": ["Why is this done this way?", "Which conditions have changed?", "What would we design if we were starting today?", "What should remain because it still works?"], "body": ["The status quo is sometimes the result of hard-earned experience. It can also be accumulated habit.", "Respect what came before you enough to understand why it exists. Then ask whether the conditions that created it still exist.", "Do not change something merely to prove you are innovative. Change it when reality shows there is a better way.", "Tradition can preserve wisdom. It should never be allowed to paralyze thinking."], "link": "7.02 Treat Impossible as Distance", "sig": ""}, {"plate": "7.02", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Treat Impossible as Distance", "lines": ["Treat impossible", "as distance,", "not a verdict."], "askHead": "Before You Build", "ask": ["What specifically makes this impossible?", "Is the barrier physical, economic, technical, regulatory, or merely unfamiliar?", "What proof would move this from impossible to plausible?"], "body": ["Impossible often describes the distance between what we know now and what we have not yet learned.", "History is a graveyard of confidently delivered never statements. Flight, instant communication across oceans, machines that see inside the body, and countless ordinary technologies began as ideas someone considered unrealistic.", "That does not mean everything imagined is achievable. It means unfamiliarity is weak evidence of impossibility.", "Before accepting impossible, identify the distance. Then decide whether the distance can be crossed. Do not celebrate the word impossible. Translate it into work."], "link": "7.03 Create Your Own Puzzles", "sig": ""}, {"plate": "7.03", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Create Your Own Puzzles", "lines": ["Do not wait", "for someone else", "to hand you", "the interesting question."], "askHead": "Before You Build", "ask": ["What bothers me that everyone else has accepted?", "What question has not been asked?", "What would I investigate if no one told me what mattered?"], "body": ["Many people become excellent at solving problems other people give them.", "Innovation often begins one step earlier: noticing a problem no one has framed yet, or asking whether an accepted limitation is actually necessary.", "The ability to create a useful puzzle is a form of invention. It gives curiosity somewhere productive to go."], "link": "7.04 Live Fantasy and Truth Together", "sig": ""}, {"plate": "7.04", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Live Fantasy and Truth Together", "lines": ["Live fantasy and truth", "at the same time."], "askHead": "Before You Build", "ask": ["What can I imagine without current constraints?", "What does reality require?", "What experiment would connect the two?"], "body": ["Innovation needs imagination and reality in equal measure.", "Fantasy allows you to picture what does not yet exist. Truth tells you what must be overcome to make it exist.", "Without imagination, reality becomes unnecessarily small. Without reality, imagination becomes delusion.", "Dream without apology. Then make the dream answer to evidence."], "link": "7.05 Failure Is Evidence of Trying", "sig": ""}, {"plate": "7.05", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Failure Is Evidence of Trying", "lines": ["Failure is sometimes", "the only thing", "that proves", "you are trying."], "askHead": "Before You Build", "ask": ["What did this failure teach me?", "What will I change because of it?", "Did I buy information, or merely repeat a mistake?"], "body": ["If you work only where success is guaranteed, you are probably operating inside what is already known.", "Failure is not automatically noble. Repeating the same preventable failure is not innovation.", "Useful failure buys information. It eliminates an assumption, reveals a weakness, or changes the next attempt.", "I have often said I get paid to fail much of the time. The failures matter because they advance the thinking that eventually makes the successful attempt possible."], "link": "7.06 The Master Has Failed More", "sig": ""}, {"plate": "7.06", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "The Master Has Failed More", "lines": ["The master has failed", "more times", "than the beginner", "has even tried."], "askHead": "Before You Build", "ask": ["What am I expecting to master too quickly?", "What failure am I afraid to experience?", "What repetition would turn knowledge into skill?"], "body": ["Expertise can look effortless from the outside because the failed attempts are usually invisible.", "Mastery is accumulated correction. The expert has encountered more edge cases, made more mistakes, and learned which errors not to repeat.", "Do not compare your first attempts with someone else's finished competence.", "Try enough times to earn your own understanding."], "link": "7.07 Persevere With Purpose", "sig": ""}, {"plate": "7.07", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Persevere With Purpose", "lines": ["Stay with", "a worthwhile problem.", "Stay willing", "to change the method."], "askHead": "Before You Build", "ask": ["Is this problem still worth solving?", "What is the evidence telling me about the method?", "What would tell me it is time to stop?"], "body": ["Perseverance is more important than perfection. Perfect is seductive because it sounds like excellence. Too often it delays contact with reality.", "Perseverance keeps the work alive long enough for reality to improve it.", "Sustain the goal while it remains worthwhile. Change the method, or stop, when the evidence warrants it.", "A perfect idea that never leaves your head changes nothing."], "link": "7.08 Every Breakthrough Accelerates", "sig": ""}, {"plate": "7.08", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Every Breakthrough Accelerates", "lines": ["Every breakthrough", "can trigger", "a rapid acceleration", "toward the goal."], "askHead": "Before You Build", "ask": ["What knowledge am I accumulating?", "Which constraint, if removed, would accelerate everything else?", "Am I measuring only visible progress?"], "body": ["Progress is rarely linear.", "For long periods, work can feel slow because you are accumulating knowledge, eliminating wrong paths, and building capability.", "Then one breakthrough changes several variables at once. What seemed distant suddenly becomes reachable.", "Do not confuse a quiet period with a useless one. Some of the most important progress is accumulating before it becomes visible."], "link": "7.09 Stack Proof", "sig": ""}, {"plate": "7.09", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Stack Proof", "lines": ["Keep moving.", "Keep refining.", "Keep stacking proof."], "askHead": "Before You Build", "ask": ["What have I actually proven?", "What remains only a claim?", "What is the next smallest proof worth earning?"], "body": ["New ideas create uncertainty. Proof reduces it.", "A claim can attract attention. Repeated evidence earns credibility.", "Prototype. Measure. Document. Repeat. Let each successful result make the next question smaller.", "The day may come when people call the outcome obvious. You will remember when it was still unthinkable."], "link": "7.10 Build What Does Not Yet Exist", "sig": ""}, {"plate": "7.10", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Build What Does Not Yet Exist", "lines": ["A vision", "without execution", "is never seen."], "askHead": "Before You Build", "ask": ["What can I make tangible?", "What is the smallest version reality can test?", "Who needs to experience it rather than hear me explain it?"], "body": ["Innovation is incomplete until someone can experience it.", "An idea can be brilliant and still have no consequence outside the mind that imagined it.", "Build the prototype. Make the machine. Test the material. Create the environment. Put reality in a position to answer you.", "The world cannot respond to what you never build."], "link": "7.11 Do Not Outsource Your Voice", "sig": ""}, {"plate": "7.11", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Do Not Outsource Your Voice", "lines": ["Reject mimicry.", "Create from", "what is lived, raw,", "and genuinely yours."], "askHead": "Before You Build", "ask": ["What in this work is genuinely mine?", "What part of my lived experience shaped it?", "What have I borrowed without improving?", "Have I polished away the fingerprint?"], "body": ["Learning from others is essential. Imitating them is not the same thing. Authenticity is not originality without influence. None of us creates in a vacuum.", "Collect perspective. Invite collaboration. Share credit generously. But do not decorate your truth with borrowed language simply because someone famous said it first.", "Make something that could only have emerged through your particular architecture of experience. Your work should carry your fingerprint, including the early imperfections that prove it was actually made.", "Create the things that become a thing before they are a thing."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 7", "section": "Innovation", "color": "#D62828", "slot": 7, "name": "Workshop Reflection", "lines": ["Innovation is curiosity", "disciplined by reality."], "askHead": "Workshop Reflection", "ask": ["What status quo have you accepted without examining?", "What failure taught you something worth keeping?", "What idea deserves its next experiment?"], "body": ["The objective is not to be unusual. It is to notice what could be better, imagine what does not yet exist, and care enough to test whether you can make it real."], "link": "8.01 Repair What We Inherit", "sig": ""}, {"plate": "8.01", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Repair What We Inherit", "lines": ["Learn what they", "did not know,", "then accept responsibility", "for what we know now."], "askHead": "Before You Act", "ask": ["What do we know now that was not known before?", "What responsibility follows from that knowledge?", "Am I using blame as a substitute for repair?", "What would doing better actually require?"], "body": ["Previous generations made decisions with the knowledge, tools, and assumptions available to them.", "Some caused real damage. Anger alone repairs nothing.", "Forgiveness does not erase consequences. It gives us a better place to begin the work.", "Slowly, we are all beginning to know better. The hope is that better action follows."], "link": "8.02 Beauty Can Hide a Broken System", "sig": ""}, {"plate": "8.02", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Beauty Can Hide a Broken System", "lines": ["A place can feel natural", "and still be", "ecologically broken."], "askHead": "Before You Act", "ask": ["What looks healthy but may not be functioning well?", "What species, plants, insects, or birds are missing?", "What would a healthier system support that this one does not?"], "body": ["Many people walk a trail and feel the good that nature gives them. They notice shade, quiet, water, birdsong, and the relief of being outside.", "They may not notice what is missing.", "They may not recognize invasive plants, missing natives, simplified understory, altered water, or the quiet absence of birds that depended on a healthier system.", "That is not a moral failure. It is usually a knowledge gap.", "Stewardship begins when we learn to see beyond the pleasant surface and ask what the system is actually supporting."], "link": "8.03 Help Nature Fix Itself", "sig": ""}, {"plate": "8.03", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Help Nature Fix Itself", "lines": ["Nature often needs", "less control than help."], "askHead": "Before You Act", "ask": ["What is preventing recovery?", "What barrier can be removed?", "What native system should return?", "When should we stop interfering and observe?"], "body": ["Humans have challenged ecosystems in countless ways, but nature is remarkably willing to recover when the conditions for recovery are restored.", "Remove invasive species. Remove sick or dangerous trees when necessary. Restore appropriate native flora. Rebuild habitat. Improve water. Then pay attention.", "The objective is not to manufacture nature. It is to remove enough obstacles that natural systems can begin doing what they already know how to do.", "Good stewardship knows when to intervene and when to get out of the way."], "link": "8.04 Birds Are a Barometer", "sig": ""}, {"plate": "8.04", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Birds Are a Barometer", "lines": ["Birds do not return", "because we wish", "them back."], "askHead": "Before You Act", "ask": ["What birds are present?", "What birds should be present but are not?", "What plants and insects support them?", "What would the system need to provide for them to return?"], "body": ["Birds return when the system begins supporting them again.", "They respond to habitat, water, food, insects, plant diversity, shelter, predators, and seasonal conditions. Their presence does not prove perfection, but their absence can reveal that something important is missing.", "If the flora birds rely upon has disappeared, the birds will go elsewhere or die off. That may happen quietly, long before most people notice the loss.", "Watch the birds. They often tell the truth before the report does."], "link": "8.05 Water Is Not Clean Because It Looks Clear", "sig": ""}, {"plate": "8.05", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Water Is Not Clean Because It Looks Clear", "lines": ["Water can look beautiful", "and still be carrying", "a problem."], "askHead": "Before You Act", "ask": ["What does the water actually contain?", "What enters the system and what leaves it?", "What is being measured?", "What is invisible to the eye but not to the system?"], "body": ["Water is one of the easiest systems to misunderstand because clear water can feel reassuring.", "But water is chemistry, movement, biology, geology, infrastructure, and history moving together.", "Good stewardship begins by asking what is actually in the water, where it came from, how it changes, and where it goes next.", "If we do not measure honestly, we may end up admiring the surface while missing the system beneath it."], "link": "8.06 Dilution Is Not Restoration", "sig": ""}, {"plate": "8.06", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Dilution Is Not Restoration", "lines": ["Dilution can make", "a number look better", "without fixing the system."], "askHead": "Before You Act", "ask": ["Did the problem actually go away?", "Was it destroyed, captured, contained, removed, or merely spread out?", "Are we improving the system or improving the appearance of compliance?", "What does the full pathway show?"], "body": ["Guidelines and thresholds matter. They create standards. But a standard can also be worked around if people care more about appearing compliant than restoring the underlying system.", "Dilution may reduce concentration. It does not necessarily remove the problem. The contaminant still exists somewhere, moving through a larger system.", "Good stewardship asks whether the problem was actually destroyed, captured, contained, removed, or transformed into something safer. A better number is not always a better system.", "Dilution is not restoration."], "link": "8.07 Essential Work Still Needs Stewardship", "sig": ""}, {"plate": "8.07", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Essential Work Still Needs Stewardship", "lines": ["Being essential", "does not make work", "exempt from improvement."], "askHead": "Before You Act", "ask": ["Is this work essential?", "How can it be done with less damage and more accountability?", "Where should better knowledge change the method?"], "body": ["Mining, energy, manufacturing, construction, agriculture, and infrastructure are not optional features of modern life.", "Many people ask me to take a stand against future mining. I do not see it that way.", "Mining work has been, and remains, essential. The right question is not whether we can pretend we do not need it. It is how we do it with better knowledge, better water protection, better reclamation, and better accountability.", "Knowing better should not make us hate the past. It should make us more responsible for the future.", "That is how knowledge becomes intellectual momentum."], "link": "8.08 Repair Damaged Places", "sig": ""}, {"plate": "8.08", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Repair Damaged Places", "lines": ["Damaged places", "deserve a future too."], "askHead": "Before You Act", "ask": ["Can this project restore something already damaged?", "What ecological function can return?", "What old problem can be resolved instead of hidden?", "Are we creating value while giving the land a future?"], "body": ["Building on untouched land is easier because the damage is invisible. Land already disturbed offers a different opportunity.", "Old industrial, mining, agricultural, or neglected sites may carry scars, but scars are not verdicts.", "When development can reclaim damaged land and restore ecological function, it can become part of the repair.", "The best development creates value and gives land a second life."], "link": "8.09 Great Communities Are Built on Infrastructure", "sig": ""}, {"plate": "8.09", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Great Communities Are Built on Infrastructure", "lines": ["Infrastructure", "is easy to ignore", "when it works", "and impossible to ignore", "when it fails."], "askHead": "Before You Act", "ask": ["What system is quietly approaching failure?", "What investment reduces future uncertainty?", "Are we optimizing for today's cost or tomorrow's reliability?", "What will people need long after the ribbon cutting is forgotten?"], "body": ["People experience communities through homes, roads, water, power, communications, public spaces, and the reliability of the systems beneath them.", "Good stewardship invests before failure becomes crisis. It plans for decades rather than seasons.", "Build systems future residents will be grateful someone had the patience to build."], "link": "8.10 Reduce Uncertainty", "sig": ""}, {"plate": "8.10", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Reduce Uncertainty", "lines": ["Reducing uncertainty", "is an investment", "in prosperity."], "askHead": "Before You Act", "ask": ["Where is uncertainty preventing useful action?", "Which uncertainty can be reduced through better systems?", "What must remain resilient even when conditions change?", "What would predicta
