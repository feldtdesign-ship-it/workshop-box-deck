bility make possible?"], "body": ["People plan more confidently when essential systems are dependable.", "Predictable water, energy, roads, rules, information, and public services allow families, businesses, and communities to make longer-term decisions.", "The purpose of engineering is not to eliminate uncertainty. It is to build systems that remain dependable within it.", "Stability is not the highest goal. It is the platform that makes higher goals possible."], "link": "8.11 Stewardship Requires Trust", "sig": ""}, {"plate": "8.11", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Stewardship Requires Trust", "lines": ["Trust grows", "when people can verify", "what is happening."], "askHead": "Before You Act", "ask": ["What baseline exists before work begins?", "What can be independently verified?", "What will be measured over time?", "Would transparency strengthen or threaten this plan, and why?"], "body": ["Accountability is not hostility.", "Responsible work becomes more credible when it can be measured, monitored, and independently understood.", "Baseline data, sensors, transparent reporting, third-party review, and accessible information do not weaken good operators. They strengthen trust.", "Stewardship should not require blind faith. It should be able to stand on evidence."], "link": "8.12 Give a Little Back", "sig": ""}, {"plate": "8.12", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Give a Little Back", "lines": ["If everyone gave", "a little back,", "many damaged systems", "could begin healing."], "askHead": "Before You Act", "ask": ["What can I restore within my reach?", "What small repair would help a larger system recover?", "Who else could join without needing to become an expert first?", "What would giving a little back look like this season?"], "body": ["Environmental restoration can feel too large when viewed only at planetary scale.", "But many useful repairs are local and physical: remove invasives, plant natives, restore habitat, reduce runoff, or monitor a stream.", "No single person has to fix everything. But almost everyone can fix something.", "Many people giving a little back adds up to far more than any one contribution."], "link": "8.13 Leave It Better", "sig": ""}, {"plate": "8.13", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Leave It Better", "lines": ["Stewardship is measured", "by what remains", "after you leave."], "askHead": "Before You Act", "ask": ["What condition did I inherit?", "What condition will I leave?", "Will the next steward have better information because I was here?", "Will the system be more capable of healing after I leave?"], "body": ["Ownership is temporary. Influence lasts longer.", "The land will outlive us. Institutions may outlive us. Infrastructure certainly can. So can damage.", "Do work that leaves future people with more options, healthier systems, clearer information, and fewer hidden problems.", "You do not have to leave everything perfect.", "Leave it capable of becoming better."], "link": "Workshop Reflection", "sig": ""}, {"plate": "Section 8", "section": "Stewardship", "color": "#7BA428", "slot": 8, "name": "Workshop Reflection", "lines": ["Stewardship begins", "when beauty", "is no longer enough."], "askHead": "Workshop Reflection", "ask": ["What system near you looks healthy but may need to be understood more deeply?", "What essential work in your world needs better stewardship rather than simple opposition?", "What could you help repair, restore, measure, protect, or improve?"], "body": ["It is easy to enjoy a place. It is harder to learn how to read it. The work begins when we care enough to ask what the system needs, what is missing, what is hidden, and what we can give back."], "link": "9.01 I Don't Want Disciples", "sig": ""}, {"plate": "9.01", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "I Don't Want Disciples", "lines": ["I don't want disciples.", "I want successors."], "askHead": "Before You Leave It Behind", "ask": ["Am I teaching people to think or to agree?", "Have I given them permission to improve my work?", "Could this continue without me?"], "body": ["Disciples preserve ideas. Successors improve them.", "If everything you taught must remain exactly as you left it, you did not create a living body of work. You created an artifact.", "Teach people enough to question you intelligently. Give them permission to replace what reality proves wrong.", "The highest compliment to a teacher may be becoming unnecessary."], "link": "9.02 Stand on My Shoulders", "sig": ""}, {"plate": "9.02", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Stand on My Shoulders", "lines": ["Feel free to stand", "on my shoulders,", "but never stand", "on my head."], "askHead": "Before You Leave It Behind", "ask": ["What can someone learn from my mistakes without repeating them?", "Where can I give someone a higher starting point?", "Am I helping them rise or making them dependent?"], "body": ["Experience should create elevation for the people who come after us.", "Share what took you years to learn so someone else can begin higher. Let them see farther because you were willing to tell them where you fell.", "But inheritance is not entitlement. Respect must move in both directions.", "The purpose of the shoulder is elevation, not submission."], "link": "9.03 Leave Better Tools", "sig": ""}, {"plate": "9.03", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Leave Better Tools", "lines": ["Leave the next generation", "better tools", "than the ones", "you inherited."], "askHead": "Before You Leave It Behind", "ask": ["What useful tool did I inherit?", "How have I improved it?", "What am I leaving that someone else can actually use?"], "body": ["Every generation inherits unfinished work.", "Some tools arrive as knowledge. Others are systems, institutions, habits, technologies, stories, or warnings.", "Use what still works. Repair what can be repaired. Replace what reality has made obsolete. Then add something of your own.", "Inheritance creates responsibility when you understand its value."], "link": "9.04 Teach Generously", "sig": ""}, {"plate": "9.04", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Teach Generously", "lines": ["Knowledge grows", "when it is shared."], "askHead": "Before You Leave It Behind", "ask": ["What do I know that exists mostly in my head?", "Who would benefit from understanding it?", "Have I explained the why, not just the what?"], "body": ["Hoarded knowledge dies surprisingly quickly.", "Teach what you know while you can still answer questions about it. Explain not only what worked, but why, what failed, and what you would do differently now.", "Great ideas are not always your own. Listen well, share credit, and hope the people around you know how to share too.", "Teaching is not the final stage of learning. It often reveals what you still do not understand."], "link": "9.05 Share the Credit", "sig": ""}, {"plate": "9.05", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Share the Credit", "lines": ["Credit does not", "become smaller", "when shared honestly.", "Credibility often", "becomes larger."], "askHead": "Before You Leave It Behind", "ask": ["Whose thinking improved this work?", "Who did something important that may be invisible?", "Have I confused leadership with authorship?"], "body": ["Most meaningful work is touched by many minds.", "Someone asked the question. Someone challenged the assumption. Someone built the prototype. Someone noticed the flaw. Someone stayed late enough to make it work.", "If you want collaborators to keep bringing you their best thinking, make sure they recognize themselves in the success."], "link": "9.06 Be the Reflection", "sig": ""}, {"plate": "9.06", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Be the Reflection", "lines": ["Be the reflection", "of what other people", "could have done", "but simply didn't."], "askHead": "Before You Leave It Behind", "ask": ["What am I capable of doing that I keep waiting for someone else to do?", "Would action teach more than criticism here?", "What example am I leaving?"], "body": ["Capability carries a quiet responsibility.", "When something important needs doing and you have the ability to help, action becomes a form of example.", "Do not waste your life proving that other people should have acted. Build the thing, fix the problem, make the call, show up.", "A useful example can outlive a persuasive complaint."], "link": "9.07 Stay Full Size", "sig": ""}, {"plate": "9.07", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Stay Full Size", "lines": ["The world is not improved", "by capable people", "pretending to be smaller", "than they are."], "askHead": "Before You Leave It Behind", "ask": ["Where am I shrinking to make other people comfortable?", "Can I own competence without turning it into ego?", "How can my capability create opportunity for someone else?"], "body": ["Humility is not self-erasure.", "You can remain teachable, share credit, and still acknowledge what you are capable of doing.", "Making yourself smaller does not make someone else larger. Used well, capability creates room for other people to become more capable too.", "Stand at full size without standing on anyone else."], "link": "4.02 Force Multipliers", "sig": ""}, {"plate": "9.08", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Let Them Own the Work", "lines": ["The work has not", "transferred", "until someone else", "feels ownership."], "askHead": "Before You Leave It Behind", "ask": ["What am I still controlling that someone else should own?", "Have I transferred context along with responsibility?", "Can I tolerate a better method that is not mine?"], "body": ["Delegation moves tasks. Succession transfers responsibility.", "People rarely protect work they feel they are merely borrowing. Give successors enough authority to make decisions, enough context to understand consequences, and enough room to make the work their own.", "They will do some things differently. That is not automatically failure. It may be evidence that succession actually occurred.", "If you require permanent control, you have not built succession."], "link": "9.09 Integrity Is the Legacy", "sig": ""}, {"plate": "9.09", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "Integrity Is the Legacy", "lines": ["My work is my voice.", "My integrity is my legacy."], "askHead": "Before You Leave It Behind", "ask": ["Would I be proud if the full story became public?", "Who paid a hidden price for this success?", "Does the method deserve to survive with the result?"], "body": ["Achievements attract attention because they are visible.", "Character is quieter. It lives in how the achievement was built, who was respected along the way, what compromises were refused, and whether the story remains true when no one is left to defend it.", "A large accomplishment built without integrity is a liability passed forward.", "Your work is one of the ways people who never meet you may still encounter how you thought.", "Build things you would be comfortable having examined after you are gone."], "link": "A Final Thought", "sig": ""}, {"plate": "Section 9", "section": "Legacy", "color": "#E8641A", "slot": 9, "name": "A Final Thought", "lines": ["I don't want disciples.", "I want successors."], "askHead": "Epilogue", "ask": [], "body": ["Everything in these pages should remain open to challenge, refinement, and improvement.", "Every body of work should eventually leave the hands that began it. Do not preserve this workshop because my name is on it. Use it until you can build something better.", "Keep what survives reality. Improve what can be improved. Replace what no longer serves. Build new ideas. Teach them generously. Leave behind better ways of thinking than the ones you inherited.", "If you do that, then you have not merely read this workshop.", "You have continued the work."], "link": "", "sig": "Dan Keck"}]};
const CARDS = DATA.cards, SECTIONS = DATA.sections;
let sec = 0, flipped = false;

const inSection = i => CARDS.filter(c => c.section === SECTIONS[i].name);

/* four fixed sizes, the same four the printed card uses, chosen by the
   longest hand set line so the break never reflows */
function sizeFor(lines){
  const longest = Math.max(...lines.map(l => l.length)), n = lines.length;
  if (longest <= 14 && n <= 5) return 30;
  if (longest <= 19 && n <= 6) return 25;
  if (longest <= 23 && n <= 7) return 21;
  return 18;
}

function cardEl(c){
  const slot = document.createElement('div');
  slot.className = 'slot';
  const reg = ['start'].concat(SECTIONS.map(s => s.name)).map((n, i) =>
    `<i class="${i===c.slot?'self':''}" style="background:${i===c.slot?'var(--paper)':'rgba(0,0,0,.19)'}"></i>`).join('');
  slot.innerHTML = `
   <div class="card" style="--c:${c.color}">
    <div class="face front" style="background:${c.color};color:#fff">
      <div class="reg">${reg}</div>
      <div class="fhead"><span class="plate">${c.plate}</span>
        <span class="sect">${c.section}</span></div>
      <div class="frule"></div>
      <div class="line" style="font-size:calc(${sizeFor(c.lines)}px * var(--k))">
        ${c.lines.map(l => `<div>${l}</div>`).join('')}</div>
      <div class="tool">${c.name}</div>
      <div class="mark">A Workshop for Better Thinking</div>
    </div>
    <div class="face back">
      <div class="bhead"><span class="bplate" style="color:${c.color}">${c.plate}</span>
        <span class="bname">${c.name}</span></div>
      <div class="brule" style="background:${c.color}"></div>
      <div class="askh" style="color:${c.color}">${c.askHead}</div>
      <ul class="ask">${c.ask.map(q => `<li>${q}</li>`).join('')}</ul>
      <div class="body">${c.body.map(p => `<p>${p}</p>`).join('')}</div>
      <div class="foot">${c.link ? `<span class="lbl">Related Tool</span>
        <span class="to" style="color:${c.color}">${c.link}</span>` : `<span class="to" style="color:${c.color}">${c.sig}</span>`}</div>
    </div>
   </div>`;
  slot.onclick = () => slot.classList.toggle('flip');
  return slot;
}

/* nothing is ever cut off: the front scales with the card, and a back whose text would run past the
   bottom steps its type down until it fits */
function fit(){
  const slot = document.querySelector('.slot'); if (!slot) return;
  document.documentElement.style.setProperty('--k', (slot.offsetWidth / 238).toFixed(4));
  document.querySelectorAll('.back').forEach(b => {
    let s = 1; b.style.setProperty('--s', s);
    while (b.scrollHeight > b.clientHeight + 0.5 && s > 0.6) { s -= 0.02; b.style.setProperty('--s', s.toFixed(2)); }
  });
}

function draw(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === sec ? ' on' : '');
    b.style.setProperty('--c', s.color);
    b.innerHTML = `<span class="nm">${s.name}</span><span class="ct">${inSection(i).length}</span>`;
    b.onclick = () => { sec = i; draw(); };
    tabs.appendChild(b);
  });

  const cards = inSection(sec);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cards.forEach(c => grid.appendChild(cardEl(c)));
  flipped = false;
  fit();

  document.getElementById('where').innerHTML =
    `<span style="color:${SECTIONS[sec].color}">${SECTIONS[sec].name}</span>` +
    `<span style="color:#8C8A84"> &nbsp;/&nbsp; ${cards.length} cards &nbsp;/&nbsp; ` +
    `section ${sec+1} of ${SECTIONS.length} &nbsp;/&nbsp; ${CARDS.length} in the box</span>`;
}

document.getElementById('prev').onclick = () => { sec = (sec - 1 + SECTIONS.length) % SECTIONS.length; draw(); };
document.getElementById('next').onclick = () => { sec = (sec + 1) % SECTIONS.length; draw(); };
document.getElementById('flip').onclick = () => {
  flipped = !flipped;
  document.querySelectorAll('.slot').forEach(s => s.classList.toggle('flip', flipped));
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key.toLowerCase() === 'f') document.getElementById('flip').click();
});

draw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
</script>
</html>
